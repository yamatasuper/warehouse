app:
  scheduling:
    enabled: true
  scheduler:
    price-update:
      enabled: true
      interval-ms: 60000 # 1 минута (60 секунд)
      batch-size: 1000   # Размер батча для обработки
spring:
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
    contexts: local # можно указывать разные контексты для разных профилей
    default-schema: PUBLIC
    parameters:
      now: NOW() # параметр для текущего времени
  datasource:
    url: jdbc:h2:file:./movchandb
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 1000 # Оптимизация для пакетных операций

logging:
  level:
    com.example.warehouse: DEBUG