spring:
  application:
    name: warehouse
  datasource:
    url: jdbc:h2:file:./movchandb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 1000
        order_updates: true
        order_inserts: true
        query:
          in_clause_parameter_padding: true
logging:
  level:
    root: INFO
    com.example.warehouse: DEBUG
    org.springframework.scheduling: DEBUG
    org.springframework.transaction: DEBUG