# ?????????? Liquibase ? ??????
spring.liquibase.enabled=false

# ????????? H2
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ?????????????? ???????? ????? Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ?????????? ?????????
spring.jpa.properties.javax.persistence.validation.mode=none

# ??????????? ?????????? SQL-????????
logging.level.org.springframework.jdbc.datasource.init=DEBUG
logging.level.org.springframework.test.context.jdbc=DEBUG

# ????????? ??????????? SQL
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Test AWS properties
aws.region=us-east-1
aws.accessKeyId=test-access-key
aws.secretAccessKey=test-secret-key
aws.s3.bucketName=test-bucket

# Disable S3 operations in tests
aws.s3.enabled=false

zeebe.client.enabled=false
camunda.enabled=false

# If using Testcontainers for Kafka
spring.kafka.bootstrap-servers=${spring.embedded.kafka.brokers}