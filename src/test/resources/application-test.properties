# Camunda BPM
camunda.bpm.client.base-url=http://localhost:8080/engine-rest
camunda.bpm.client.async-response-timeout=10000
camunda.bpm.client.subscriptions.compliance-check.lock-duration=10000
camunda.bpm.client.subscriptions.register-contract.lock-duration=10000
camunda.bpm.client.subscriptions.register-delivery.lock-duration=10000
camunda.bpm.client.subscriptions.make-payment.lock-duration=10000
camunda.bpm.database.type=postgres
camunda.bpm.database.schema-update=true
camunda.bpm.history-level=full
camunda.bpm.job-execution.enabled=true
camunda.bpm.admin-user.id=demo
camunda.bpm.admin-user.password=demo

# Currency Service
currency-service.host=localhost
currency-service.port=8080

# Zeebe
zeebe.client.broker.gateway-address=localhost:26500
zeebe.client.security.plaintext=true

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.group-id=test-order-service

# Database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_UPPER=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# WireMock
wiremock.server.port=0

spring.liquibase.enabled=false

# AWS / S3
aws.access-key-id=test-key
aws.secret-key=test-secret
aws.region=us-east-1
s3.enabled=false
